name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  SERVICE: jokari-website
  IMAGE: europe-west6-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/jokari-repo/jokari-website

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west6-docker.pkg.dev --quiet

      - name: Build image
        run: |
          docker build \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest \
            .

      - name: Push image
        run: |
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Create env vars file
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          JOKARI_FROM_EMAIL: ${{ secrets.JOKARI_FROM_EMAIL }}
          JOKARI_FROM_NAME: ${{ secrets.JOKARI_FROM_NAME }}
          JOKARI_ADMIN_EMAILS: ${{ secrets.JOKARI_ADMIN_EMAILS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          cat > env-vars.yaml <<EOF
          GCP_PROJECT_ID: "${{ secrets.GCP_PROJECT_ID }}"
          NODE_ENV: "production"
          SENDGRID_API_KEY: "${SENDGRID_API_KEY}"
          JOKARI_FROM_EMAIL: "${JOKARI_FROM_EMAIL}"
          JOKARI_FROM_NAME: "${JOKARI_FROM_NAME}"
          JOKARI_ADMIN_EMAILS: "${JOKARI_ADMIN_EMAILS}"
          JOKARI_PUBLIC_URL: "https://jokari.ch"
          JWT_SECRET: "${JWT_SECRET}"
          EOF
          echo "env-vars.yaml created with $(grep -c ':' env-vars.yaml) variables"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE \
            --image=$IMAGE:${{ github.sha }} \
            --region=${{ secrets.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=10 \
            --env-vars-file=env-vars.yaml

      - name: Show service URL
        run: |
          gcloud run services describe $SERVICE \
            --region=${{ secrets.GCP_REGION }} \
            --format='value(status.url)'
